  .ok{color:var(--ok);font-weight:700;}

  <div class="sub">1) 정리된 주소로 먼저 시도 → 2) 실패하면 유산 이름으로 장소(키워드) 검색 → 3) 그래도 실패하면 지역명+이름으로 재검색. 항목당 최대 3번, 호출 간격 1.2초.</div>

    </div>
    <div class="row">

      <button id="downloadCsvBtn" disabled>결과 CSV 다운로드</button>

    <div class="stats">

    <div id="statusLine">대기 중...</div>
  </div>

    </table>
  </div>
</div>

a": "충청북도 청주시 청원구 오창공원로 311"}, {"id": "2662504150001", "n": "형제송", "a": "충청남도 아산시 인주면 해암리 산 63-1"}, {"id": "4413404760000", "n": "안익태 대한국애국가 자필악보", "a": "충청남도 천안시 동남구 목천읍 남화리 230 독립기념관"}, {"id": "4413405040000", "n": "애국가 유성기 음반", "a": "충청남도 천안시 동남구 삼방로 95 독립기념관"}, {"id": "4413307900000", "n": "6·25 전쟁 군사 기록물(공군 전투비행단)", "a": "충청북도 청주시 상당구 단재로 635 국립공군박물관"}, {"id": "4413308140000", "n": "공군사관학교 제1기 졸업생 첫 출격 서명문 태극기", "a": "충청북도 청주시 상당구 단재로 635"}, {"id": "4413306670000", "n": "국민성금 헌납기(T-6 건국기)", "a": "충청북도 청주시 상당구 단재로 635 공군박물관"}, {"id": "4413306660000", "n": "대한민국 최초 운용 전투기(F-51D 무스탕)", "a": "충청북도 청주시 상당구 단재로 635 공군박물관"}, {"id": "2443100130000", "n": "전 월산대군 요여", "a": "경기도 고양시 덕양구 호국로 1243-39"}, {"id": "2113103570000", "n": "북한 승도절목", "a": "경기도 고양시 덕양구 북한산성로 262"}, {"id": "1123213080000", "n": "홍진 호성공신교서", "a": "강원특별자치도 홍천군 북방면 능평리 154"}, {"id": "3413101730000", "n": "가평 현등사 지장시왕도", "a": "경기도 가평군 조종면 하관리 산163"}, {"id": "2113603120000", "n": "여수 흥국사 중수사적비", "a": "전라남도 여수시 흥국사길 149"}];
const STORAGE_KEY = 'hm_geocode_progress_v9_keyword';

let geocoder = null;
let places = null;
let sdkLoaded = false;
let running = false;
let idx = 0;
let timer = null;
const results = {};

const el = id => document.getElementById(id);
const apiKeyInput = el('apiKey');
const startBtn = el('startBtn');
const pauseBtn = el('pauseBtn');
const resetBtn = el('resetBtn');
const downloadCsvBtn = el('downloadCsvBtn');
const statusLine = el('statusLine');
const logBody = el('logBody');

function loadProgress(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      Object.assign(results, parsed.results || {});
      idx = parsed.idx || 0;
    }
  }catch(e){}
  updateStats();
}
function saveProgress(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify({results, idx})); }catch(e){}
}
loadProgress();

function updateStats(){
  const done = Object.keys(results).length;
  const ok = Object.values(results).filter(r => r.status==='ok').length;
  const fail = Object.values(results).filter(r => r.status==='fail').length;
  el('stDone').textContent = done;
  el('stOk').textContent = ok;
  el('stFail').textContent = fail;
  el('stRemain').textContent = ITEMS.length - done;
  downloadCsvBtn.disabled = done === 0;
}
function prependLog(item, status, method, query, lat, lon){
  const tr = document.createElement('tr');
  tr.innerHTML = `<td>${item.n}</td><td class="${status==='ok'?'ok':'fail'}">${status==='ok'?'성공':'실패'}</td><td><span class="method">${method||''}</span></td><td>${query||''}</td><td>${lat??''}</td><td>${lon??''}</td>`;
  logBody.insertBefore(tr, logBody.firstChild);
  while(logBody.children.length > 200) logBody.removeChild(logBody.lastChild);
}

function loadKakaoSdk(){
  const key = apiKeyInput.value.trim();
  if(!key){ alert('먼저 JavaScript 키를 입력해주세요.'); return; }
  const sdkStatus = el('sdkStatus');
  sdkStatus.textContent = '불러오는 중…';
  const script = document.createElement('script');
  script.src = 'https://dapi.kakao.com/v2/maps/sdk.js?appkey=' + encodeURIComponent(key) + '&libraries=services&autoload=false';
  script.onload = () => {
    kakao.maps.load(() => {
      geocoder = new kakao.maps.services.Geocoder();
      places = new kakao.maps.services.Places();
      sdkLoaded = true;
      sdkStatus.textContent = '✅ 준비 완료! 이제 "시작" 버튼을 누르세요.';
      startBtn.disabled = false;
    });
  };
  script.onerror = () => { sdkStatus.textContent = '❌ 불러오기 실패. 키를 다시 확인해주세요.'; };
  document.body.appendChild(script);
}
el('loadSdkBtn').addEventListener('click', loadKakaoSdk);

function addressSearchOne(address){
  return new Promise((resolve) => {
    geocoder.addressSearch(address, (result, status) => {
      if(status === kakao.maps.services.Status.OK && result.length > 0){
        resolve({ lat: parseFloat(result[0].y), lon: parseFloat(result[0].x) });
      } else { resolve(null); }
    });
  });
}
function keywordSearchOne(query){
  return new Promise((resolve) => {
    places.keywordSearch(query, (result, status) => {
      if(status === kakao.maps.services.Status.OK && result.length > 0){
        resolve({ lat: parseFloat(result[0].y), lon: parseFloat(result[0].x) });
      } else { resolve(null); }
    });
  });
}

function regionOf(address){
  // 주소 앞부분(시/도 + 시/군/구)만 추출
  const m = address.match(/^(\S+[시도]\s?\S*[시군구])/);
  return m ? m[1] : '';
}

async function geocodeItem(item){
  // 1) 정리된 주소로 시도
  let geo = await addressSearchOne(item.a);
  if(geo) return { geo, method:'주소검색', query: item.a };
  await new Promise(r => setTimeout(r, 400));

  // 2) 유산 이름으로 키워드(장소) 검색
  geo = await keywordSearchOne(item.n);
  if(geo) return { geo, method:'이름검색', query: item.n };
  await new Promise(r => setTimeout(r, 400));

  // 3) 지역명 + 이름으로 재검색
  const region = regionOf(item.a);
  if(region){
    const q = region + ' ' + item.n;
    geo = await keywordSearchOne(q);
    if(geo) return { geo, method:'지역+이름검색', query: q };
  }
  return null;
}

async function step(){
  if(!running) return;
  if(idx >= ITEMS.length){
    running = false;
    statusLine.textContent = '완료되었습니다! 결과를 다운로드해주세요.';
    startBtn.disabled = false; pauseBtn.disabled = true;
    return;
  }
  const item = ITEMS[idx];
  const key = String(item.id);
  if(results[key]){
    idx++;
    timer = setTimeout(step, 0);
    return;
  }
  try{
    const found = await geocodeItem(item);
    if(found){
      results[key] = { status:'ok', lat: found.geo.lat, lon: found.geo.lon, method: found.method, query: found.query };
      prependLog(item, 'ok', found.method, found.query, found.geo.lat, found.geo.lon);
    } else {
      results[key] = { status:'fail', lat:null, lon:null };
      prependLog(item, 'fail', '', '', null, null);
    }
  }catch(e){
    results[key] = { status:'fail', lat:null, lon:null };
    prependLog(item, 'fail', '', '', null, null);
  }
  idx++;
  updateStats();
  saveProgress();
  statusLine.textContent = `처리 중… (${idx}/${ITEMS.length}) ${item.n}`;
  timer = setTimeout(step, 1200);
}

startBtn.addEventListener('click', () => {
  if(!apiKeyInput.value.trim()){ alert('먼저 카카오 JavaScript 키를 입력해주세요.'); return; }
  running = true;
  startBtn.disabled = true;
  pauseBtn.disabled = false;
  statusLine.textContent = '시작합니다…';
  step();
});
pauseBtn.addEventListener('click', () => {
  running = false;
  clearTimeout(timer);
  startBtn.disabled = false;
  pauseBtn.disabled = true;
  statusLine.textContent = '일시정지됨.';
});
resetBtn.addEventListener('click', () => {
  running = false;
  clearTimeout(timer);
  idx = 0;
  for(const k in results) delete results[k];
  logBody.innerHTML = '';
  localStorage.removeItem(STORAGE_KEY);
  updateStats();
  startBtn.disabled = false; pauseBtn.disabled = true;
  statusLine.textContent = '초기화되었습니다.';
});
downloadCsvBtn.addEventListener('click', () => {
  let csv = '고유키,이름,정리주소,상태,방법,사용검색어,위도,경도\n';
  ITEMS.forEach(item => {
    const r = results[String(item.id)];
    if(!r) return;
    const row = [item.id, item.n, item.a, r.status, r.method||'', r.query||'', r.lat ?? '', r.lon ?? ''];
    csv += row.map(v => `"${String(v).replace(/"/g,'""')}"`).join(',') + '\n';
  });
  const blob = new Blob(["\uFEFF" + csv], {type:'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'geocode_results_v9_keyword.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light only">
<meta property="og:title" content="국가유산지도">
<meta property="og:description" content="전국 국가유산 위치 안내 — 문화유산·자연유산을 지도에서 확인하세요">
<meta property="og:image" content="https://uniggum6-coder.github.io/heritage-map/share-card.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://uniggum6-coder.github.io/heritage-map/">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f3d3e">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="favicon-64.png">
<link rel="apple-touch-icon" href="favicon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="국가유산지도">
<title>국가유산지도 — 전국 국가유산 위치 안내</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.css" />
<style>
  :root{
    --navy:#0f3d3e; --teal:#1f6f6b; --teal-light:#4fa39d; --sand:#f4efe6;
    --ink:#1c2b2b; --muted:#6b7d7c; --line:#e2ddd2; --card:#ffffff;
  }
  *{box-sizing:border-box;}
  html{color-scheme:light;}
  body{margin:0;font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:var(--ink);background:var(--sand);height:100vh;display:flex;flex-direction:column;overflow:hidden;}
  header{background:linear-gradient(135deg,var(--navy),var(--teal));color:#fff;padding:0;position:relative;overflow:hidden;flex:none;max-height:200px;transition:max-height .25s ease,opacity .2s ease;}
  header.header-hidden{max-height:0;opacity:0;}
  .headerbar{display:flex;align-items:center;justify-content:space-between;padding:14px 28px;position:relative;z-index:2;}
  .brand{display:flex;flex-direction:column;gap:2px;}
  .brand .brand-title{display:flex;align-items:center;gap:10px;font-weight:700;font-size:19px;}
  .brand .src-note{font-size:11px;font-weight:400;opacity:0.7;margin-left:10px;}
  .brand .logo-mark{height:26px;width:auto;flex:none;}
  .brand .brand-sub{font-size:12px;opacity:0.8;margin-left:22px;}
  #tabListBtn{margin-top:14px;width:100%;padding:9px;background:var(--teal);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;}
  #tabListBtn:hover{background:var(--navy);}
  #tabMapBtn{margin:20px 28px 4px;padding:8px 16px;background:var(--navy);color:#fff;border:none;border-radius:20px;cursor:pointer;font-size:13px;font-weight:600;}
  #tabMapBtn:hover{background:var(--teal);}
  main{display:flex;flex:1;min-height:0;}
  #view-map{display:flex;width:100%;height:100%;position:relative;}
  aside{width:300px;min-width:260px;background:var(--card);border-right:1px solid var(--line);padding:18px;overflow-y:auto;transition:margin-left .25s ease;position:relative;}
  aside.collapsed{margin-left:-300px;}
  .sheet-handle{display:none;}
  .sidebar-logo-card{
    display:flex;align-items:center;gap:12px;
    background:var(--sand);border-radius:10px;
    padding:14px;margin-bottom:18px;
  }
  .sidebar-logo-card img{height:88px;width:auto;flex:none;}
  .sidebar-logo-card span{font-weight:700;font-size:15px;color:var(--navy);}
  .sidebar-logo-card .catchphrase{display:flex;flex-direction:column;gap:8px;}
  .sidebar-logo-card .catchphrase strong{font-size:23px;font-weight:700;color:var(--navy);}
  .sidebar-logo-card .catchphrase{font-size:14px;font-weight:500;color:var(--navy);}

  #sidebarToggle{
    position:absolute;top:50%;left:300px;transform:translateY(-50%);z-index:1000;
    width:28px;height:90px;background:#fff;border:1px solid var(--line);border-left:none;
    border-radius:0 10px 10px 0;cursor:pointer;display:flex;align-items:center;justify-content:center;
    box-shadow:2px 0 6px rgba(0,0,0,.18);transition:left .25s ease;font-size:18px;color:#e0392b;font-weight:700;
  }
  aside.collapsed ~ #sidebarToggle{left:0;}
  aside h3{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:18px 0 8px;}
  aside h3:first-child{margin-top:0;}
  input[type=text]{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px;}
  select{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:#fff;}
  .cat-list input[type=checkbox]{width:16px;height:16px;cursor:pointer;flex:none;}
  .cat-list label{display:flex;align-items:center;gap:8px;font-size:13px;padding:6px 0;cursor:pointer;}
  .cat-swatch{width:11px;height:11px;border-radius:3px;flex:none;}
  .group-swatch{width:16px;height:16px;border-radius:4px;flex:none;}
  #resetBtn{margin-top:14px;width:100%;padding:9px;background:var(--navy);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;}
  #resetBtn:hover{background:var(--teal);}
  #count{margin-top:14px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px;}
  #map{flex:1;}
  .leaflet-popup-content{font-family:inherit;min-width:220px;max-width:280px;max-height:320px;overflow-y:auto;}
  .popup-cat{display:inline-block;font-size:11px;font-weight:700;color:#fff;padding:2px 8px;border-radius:10px;margin-bottom:6px;}
  .popup-title{font-size:15px;font-weight:700;margin:0 0 4px;}
  .popup-meta{font-size:12px;color:var(--muted);margin:0 0 6px;}
  .popup-img{width:100%;height:110px;object-fit:cover;border-radius:6px;margin-bottom:6px;}
  .popup-desc{font-size:12.5px;line-height:1.5;color:#333;}
  .cluster-pick:hover{background:#f4efe6;}
  .cluster-pick:last-child{border-bottom:none;}
  .marker-tip{background:var(--navy);color:#fff;border:none;font-size:12px;padding:5px 10px;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,.25);line-height:1.3;text-align:center;}
  .marker-tip .tip-cat{font-size:10.5px;opacity:0.8;font-weight:500;}
  .marker-tip .tip-name{font-weight:700;}
  .marker-tip::before{border-top-color:var(--navy);}
  /* custom cluster icon (colored by dominant category, opaque, white ring) */
  .custom-cluster-icon{background:transparent;border:none;}
  /* intangible list view */
  #view-list{display:none;width:100%;height:100%;overflow-y:auto;padding:24px 28px;}
  .ilist-controls{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap;}
  .ilist-controls input, .ilist-controls select{max-width:260px;}
  .icards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;}
  .icard{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;}
  .icard img{width:100%;height:120px;object-fit:cover;border-radius:6px;margin-bottom:8px;background:#eee;}
  .icard .tag{display:inline-block;font-size:11px;font-weight:700;color:#fff;background:var(--teal);padding:2px 8px;border-radius:10px;margin-bottom:6px;}
  .icard h4{margin:0 0 4px;font-size:14.5px;}
  .icard .meta{font-size:12px;color:var(--muted);margin-bottom:6px;}
  .icard .desc{font-size:12.5px;line-height:1.5;color:#333;}
  footer{font-size:11px;color:var(--muted);text-align:center;padding:8px;background:var(--card);border-top:1px solid var(--line);}
  .msg-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:9999;}
  .msg-box{background:#fff;padding:24px;border-radius:12px;max-width:360px;text-align:center;}
  .msg-box button{margin-top:14px;padding:8px 20px;border:none;background:var(--navy);color:#fff;border-radius:8px;cursor:pointer;}
</style>
</head>
<body>

<header>
  <div class="headerbar">
    <div class="brand">
      <div class="brand-title">국가유산지도<span class="src-note">데이터 출처: 국가유산청</span></div>
    </div>
  </div>
</header>

<main>
  <div id="view-map">
    <aside>
      <div class="sheet-handle" id="sheetHandle"></div>
      <h3>검색</h3>
      <input type="text" id="searchBox" placeholder="이름 또는 주소로 검색">

      <h3>지역</h3>
      <select id="regionSelect"><option value="">전체 지역</option></select>

      <h3>지정종목</h3>
      <div class="cat-list" id="catList"></div>

      <button id="resetBtn">필터 초기화</button>
      <button id="tabListBtn">무형유산 목록 보기 →</button>
      <div id="count">표시 중</div>
    </aside>
    <div id="sidebarToggle">◀</div>
    <div id="map"></div>
  </div>

  <div id="view-list">
    <button id="tabMapBtn">← 지도로 돌아가기</button>
    <div class="ilist-controls">
      <input type="text" id="ilistSearch" placeholder="무형유산 이름으로 검색">
      <select id="ilistRegion"><option value="">전체 지역</option></select>
      <select id="ilistCat"><option value="">전체 종목</option></select>
    </div>
    <div class="icards" id="icards"></div>
  </div>
</main>


<div class="msg-overlay" id="msgOverlay"><div class="msg-box"><p id="msgText"></p><button onclick="document.getElementById('msgOverlay').style.display='none'">확인</button></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.min.js"></script>
<script src="data_map.js"></script>
<script src="data_intangible.js"></script>
<script>
const CAT_COLORS = {
  // 자연유산 (green family)
  "천연기념물":"#40916c", "명승":"#74c69d",
  // 국가지정 문화유산 (red family)
  "국보":"#7a1f1a", "보물":"#c0392b", "사적":"#e0592b",
  "국가민속문화유산":"#e8837a", "국가등록문화유산":"#a85c3a",
  // 시도지정 문화유산 (blue family)
  "시도유형문화유산":"#1b4f72", "시도민속문화유산":"#2980b9",
  "시도기념물":"#5dade2", "문화유산자료":"#a9cce3"
};
function colorFor(cat){ return CAT_COLORS[cat] || "#555"; }

const TN_SUB_COLORS = {
  "동물":"#1b4332", "식물":"#52b788", "지질·지형":"#b08968", "천연보호구역":"#264653", "미분류":"#8d99ae"
};
const TN_SUBCATS = ["동물","식물","지질·지형","천연보호구역"];
function markerColorFor(d){
  if(d.c === '천연기념물') return TN_SUB_COLORS[d.nc] || TN_SUB_COLORS['미분류'];
  return colorFor(d.c);
}

const CAT_GROUPS = {
  "자연유산": ["천연기념물","명승"],
  "국가지정 문화유산": ["국보","보물","사적","국가민속문화유산","국가등록문화유산"],
  "시도지정 문화유산": ["시도유형문화유산","시도민속문화유산","시도기념물","문화유산자료"]
};
const GROUP_COLORS = {
  "자연유산": "#2e8b57",
  "국가지정 문화유산": "#c0392b",
  "시도지정 문화유산": "#2980b9"
};
const CAT_TO_GROUP = {};
Object.entries(CAT_GROUPS).forEach(([g, cats]) => cats.forEach(c => CAT_TO_GROUP[c] = g));
function groupFor(cat){ return CAT_TO_GROUP[cat] || "기타"; }
function groupColorFor(cat){ return GROUP_COLORS[groupFor(cat)] || "#555"; }

function showMsg(t){ document.getElementById('msgText').textContent = t; document.getElementById('msgOverlay').style.display='flex'; }

// ---- MAP VIEW ----
let map, clusterGroup;
let allMarkers = [];

function initMap(){
  L.Path.CLICK_TOLERANCE = 20; // widen the clickable hit area around thin/small paths
  const koreaBounds = L.latLngBounds([30.5, 121.0], [41.5, 135.0]);
  map = L.map('map', {
    zoomControl:true,
    minZoom:6,
    maxBounds: koreaBounds,
    maxBoundsViscosity: 0.7
  }).setView([36.2, 127.8], 7);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 18, minZoom:6, noWrap:true,
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);
  clusterGroup = L.markerClusterGroup({
    maxClusterRadius:50,
    zoomToBoundsOnClick:false,
    spiderfyOnMaxZoom:false,
    iconCreateFunction: function(cluster){
      const children = cluster.getAllChildMarkers();
      const counts = {};
      children.forEach(m => { const g = groupFor(m._d.c); counts[g] = (counts[g]||0) + 1; });
      let topGroup = null, topCount = -1;
      for(const g in counts){ if(counts[g] > topCount){ topCount = counts[g]; topGroup = g; } }
      const color = GROUP_COLORS[topGroup] || "#555";
      const count = children.length;
      const size = count < 10 ? 34 : (count < 50 ? 44 : 54);
      const fontSize = count < 100 ? 13 : 11;
      return L.divIcon({
        html: `<div style="background:${color};width:${size}px;height:${size}px;border-radius:50%;border:3px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,0.45);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:${fontSize}px;">${count}</div>`,
        className: 'custom-cluster-icon',
        iconSize: L.point(size, size)
      });
    }
  });

  MAP_DATA.forEach((d, idx) => {
    const marker = L.circleMarker([d.la, d.lo], {
      radius:10, fillColor: markerColorFor(d), color:"#fff", weight:2, fillOpacity:1, opacity:1
    });
    marker._d = d;
    marker.bindPopup(buildPopup(d));
    marker.bindTooltip(`<div class="tip-cat">${escapeHtml(d.c)}</div><div class="tip-name">${escapeHtml(d.n)}</div>`, {direction:'top', offset:[0,-8], opacity:0.92, className:'marker-tip'});
    allMarkers.push(marker);
    clusterGroup.addLayer(marker);
  });
  map.addLayer(clusterGroup);

  // Custom cluster click: small clusters show a pick-list (more reliable than spiderfy legs),
  // large clusters zoom in toward their bounds.
  clusterGroup.on('clusterclick', function(e){
    const cluster = e.layer;
    const children = cluster.getAllChildMarkers();
    if(children.length <= 10){
      const items = children.map((m,i) => {
        const d = m._d;
        return `<div class="cluster-pick" data-idx="${i}" style="padding:6px 4px;border-bottom:1px solid #eee;cursor:pointer;">
          <span class="popup-cat" style="background:${markerColorFor(d)};font-size:10px;">${escapeHtml(d.c)}${d.nc ? ' · '+escapeHtml(d.nc) : ''}</span>
          <div style="font-size:13px;font-weight:600;">${escapeHtml(d.n)}</div>
        </div>`;
      }).join('');
      const html = `<div style="max-height:220px;overflow-y:auto;min-width:200px;">
        <div style="font-size:12px;color:#888;margin-bottom:4px;">이 위치에 ${children.length}건이 있어요. 항목을 선택하세요.</div>
        ${items}
      </div>`;
      const popup = L.popup({maxWidth:260}).setLatLng(cluster.getLatLng()).setContent(html).openOn(map);
      setTimeout(() => {
        document.querySelectorAll('.cluster-pick').forEach(el => {
          el.addEventListener('click', () => {
            const m = children[parseInt(el.dataset.idx)];
            map.closePopup();
            clusterGroup.zoomToShowLayer(m, () => m.openPopup());
          });
        });
      }, 0);
    } else {
      cluster.zoomToBounds({padding:[20,20]});
    }
  });
  updateCount(MAP_DATA.length);
}

function buildPopup(d){
  const img = d.i ? `<img class="popup-img" src="${escapeHtml(d.i)}" onerror="this.style.display='none'">` : '';
  return `<div>
    <span class="popup-cat" style="background:${markerColorFor(d)}">${escapeHtml(d.c)}${d.nc ? ' · '+escapeHtml(d.nc) : ''}</span>
    <div class="popup-title">${escapeHtml(d.n)}</div>
    <div class="popup-meta">${escapeHtml(d.r||'')} ${escapeHtml(d.s||'')} · ${escapeHtml(d.d||'지정일 미상')}</div>
    ${img}
    <div class="popup-desc">${escapeHtml(d.a||'')}${d.e ? '<br><br>'+escapeHtml(d.e) : ''}</div>
  </div>`;
}
function escapeHtml(s){ if(s==null) return ''; return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function updateCount(n){ document.getElementById('count').textContent = n.toLocaleString() + '건 표시 중'; }

function populateFilters(){
  const regionSel = document.getElementById('regionSelect');
  const regions = [...new Set(MAP_DATA.map(d=>d.r))].sort();
  regions.forEach(r => { const o=document.createElement('option'); o.value=r; o.textContent=r; regionSel.appendChild(o); });

  const cats = [...new Set(MAP_DATA.map(d=>d.c))];
  const catList = document.getElementById('catList');
  Object.entries(CAT_GROUPS).forEach(([groupName, groupCats]) => {
    const present = groupCats.filter(c => cats.includes(c));
    if(present.length === 0) return;
    const groupTotal = present.reduce((sum,c) => sum + MAP_DATA.filter(d=>d.c===c).length, 0);

    const heading = document.createElement('div');
    heading.className = 'group-heading';
    heading.style.cssText = 'font-weight:700;font-size:13.5px;margin:8px 0;color:var(--navy);display:flex;align-items:center;gap:8px;padding:10px 8px;border-radius:8px;background:#faf8f4;';
    heading.innerHTML = `
      <input type="checkbox" class="groupChk" data-group="${groupName}" checked style="width:16px;height:16px;flex:none;cursor:pointer;">
      <span class="group-swatch" style="background:${GROUP_COLORS[groupName]||'#555'}"></span>
      <span class="group-label" style="flex:1;cursor:pointer;">${groupName} <span style="color:#999;font-weight:500;">(${groupTotal.toLocaleString()})</span></span>
      <span class="group-arrow" style="cursor:pointer;font-size:11px;color:#999;transition:transform .2s;">▶</span>
    `;
    catList.appendChild(heading);

    const subWrap = document.createElement('div');
    subWrap.className = 'group-sub';
    subWrap.style.cssText = 'display:none;padding:2px 0 6px;';
    present.forEach(c => {
      const label = document.createElement('label');
      label.style.paddingLeft = '10px';
      label.innerHTML = `<input type="checkbox" class="catChk" data-group="${groupName}" value="${c}" checked> <span class="cat-swatch" style="background:${colorFor(c)}"></span> ${c} <span style="color:#999">(${MAP_DATA.filter(d=>d.c===c).length})</span>`;
      subWrap.appendChild(label);

      if(c === '천연기념물'){
        label.style.cursor = 'default';
        const natArrow = document.createElement('span');
        natArrow.textContent = '▶';
        natArrow.style.cssText = 'cursor:pointer;font-size:10px;color:#999;margin-left:4px;transition:transform .2s;';
        label.appendChild(natArrow);

        const natWrap = document.createElement('div');
        natWrap.style.cssText = 'display:none;padding:2px 0 4px 26px;';
        TN_SUBCATS.forEach(nc => {
          const ncCount = MAP_DATA.filter(d => d.c === '천연기념물' && d.nc === nc).length;
          if(ncCount === 0) return;
          const ncLabel = document.createElement('label');
          ncLabel.innerHTML = `<input type="checkbox" class="natChk" value="${nc}" checked> <span class="cat-swatch" style="background:${TN_SUB_COLORS[nc]}"></span> ${nc} <span style="color:#999">(${ncCount})</span>`;
          natWrap.appendChild(ncLabel);
        });
        subWrap.appendChild(natWrap);

        const toggleNat = (e) => {
          e.preventDefault();
          e.stopPropagation();
          const open = natWrap.style.display !== 'none';
          natWrap.style.display = open ? 'none' : 'block';
          natArrow.style.transform = open ? 'rotate(0deg)' : 'rotate(90deg)';
        };
        natArrow.addEventListener('click', toggleNat);
      }
    });
    catList.appendChild(subWrap);

    const arrow = heading.querySelector('.group-arrow');
    const toggleExpand = () => {
      const open = subWrap.style.display !== 'none';
      subWrap.style.display = open ? 'none' : 'block';
      arrow.style.transform = open ? 'rotate(0deg)' : 'rotate(90deg)';
    };
    heading.querySelector('.group-label').addEventListener('click', toggleExpand);
    arrow.addEventListener('click', toggleExpand);
  });
  document.querySelectorAll('.catChk').forEach(chk => chk.addEventListener('change', () => {
    syncGroupCheckboxState(chk.dataset.group);
    applyFilters();
  }));
  document.querySelectorAll('.natChk').forEach(nchk => nchk.addEventListener('change', applyFilters));
  document.querySelectorAll('.groupChk').forEach(gchk => gchk.addEventListener('change', () => {
    const group = gchk.dataset.group;
    document.querySelectorAll(`.catChk[data-group="${group}"]`).forEach(c => c.checked = gchk.checked);
    gchk.indeterminate = false;
    applyFilters();
  }));
}

function syncGroupCheckboxState(group){
  const subs = [...document.querySelectorAll(`.catChk[data-group="${group}"]`)];
  const groupChk = document.querySelector(`.groupChk[data-group="${group}"]`);
  if(!groupChk) return;
  const checkedCount = subs.filter(s => s.checked).length;
  if(checkedCount === 0){ groupChk.checked = false; groupChk.indeterminate = false; }
  else if(checkedCount === subs.length){ groupChk.checked = true; groupChk.indeterminate = false; }
  else { groupChk.checked = false; groupChk.indeterminate = true; }
}

function applyFilters(){
  document.getElementById('count').textContent = '처리 중…';
  // defer the heavy work one tick so the browser can paint "처리 중" first
  setTimeout(() => {
    const q = document.getElementById('searchBox').value.trim().toLowerCase();
    const region = document.getElementById('regionSelect').value;
    const checked = [...document.querySelectorAll('.catChk:checked')].map(c=>c.value);
    const checkedSet = new Set(checked);
    const checkedNat = new Set([...document.querySelectorAll('.natChk:checked')].map(c=>c.value));

    const matched = [];
    for(let i = 0; i < allMarkers.length; i++){
      const m = allMarkers[i];
      const d = m._d;
      if(!checkedSet.has(d.c)) continue;
      if(d.c === '천연기념물' && !checkedNat.has(d.nc)) continue;
      if(region && d.r !== region) continue;
      if(q && !((d.n && d.n.toLowerCase().includes(q)) || (d.a && d.a.toLowerCase().includes(q)))) continue;
      matched.push(m);
    }
    clusterGroup.clearLayers();
    clusterGroup.addLayers(matched); // bulk add — much faster than addLayer in a loop
    updateCount(matched.length);
  }, 0);
}

document.getElementById('searchBox').addEventListener('input', applyFilters);
document.getElementById('regionSelect').addEventListener('change', applyFilters);
document.getElementById('resetBtn').addEventListener('click', () => {
  document.getElementById('searchBox').value='';
  document.getElementById('regionSelect').value='';
  document.querySelectorAll('.catChk').forEach(c=>c.checked=true);
  applyFilters();
});

// ---- INTANGIBLE LIST VIEW ----
function initIntangibleList(){
  const regionSel = document.getElementById('ilistRegion');
  const regions = [...new Set(INTANGIBLE_DATA.map(d=>d.r))].sort();
  regions.forEach(r => { const o=document.createElement('option'); o.value=r; o.textContent=r; regionSel.appendChild(o); });

  const catSel = document.getElementById('ilistCat');
  const cats = [...new Set(INTANGIBLE_DATA.map(d=>d.c))].sort();
  cats.forEach(c => { const o=document.createElement('option'); o.value=c; o.textContent=c; catSel.appendChild(o); });

  renderIntangible();
  document.getElementById('ilistSearch').addEventListener('input', renderIntangible);
  regionSel.addEventListener('change', renderIntangible);
  catSel.addEventListener('change', renderIntangible);
}

function renderIntangible(){
  const q = document.getElementById('ilistSearch').value.trim().toLowerCase();
  const region = document.getElementById('ilistRegion').value;
  const cat = document.getElementById('ilistCat').value;
  const wrap = document.getElementById('icards');
  wrap.innerHTML = '';
  const filtered = INTANGIBLE_DATA.filter(d => {
    if(region && d.r !== region) return false;
    if(cat && d.c !== cat) return false;
    if(q && !(d.n && d.n.toLowerCase().includes(q))) return false;
    return true;
  }).sort((a,b) => (a.n||'').localeCompare(b.n||'', 'ko')).slice(0, 300);

  filtered.forEach(d => {
    const div = document.createElement('div');
    div.className = 'icard';
    div.innerHTML = `
      ${d.i ? `<img src="${escapeHtml(d.i)}" onerror="this.style.display='none'">` : ''}
      <span class="tag">${escapeHtml(d.c)}</span>
      <h4>${escapeHtml(d.n)}</h4>
      <div class="meta">${escapeHtml(d.r||'')} ${escapeHtml(d.s||'')} · ${escapeHtml(d.d||'지정일 미상')}${d.o ? ' · '+escapeHtml(d.o) : ''}</div>
      <div class="desc">${escapeHtml(d.e||'')}</div>
    `;
    wrap.appendChild(div);
  });
  if(filtered.length === 300){
    const note = document.createElement('div');
    note.style.cssText = 'grid-column:1/-1;text-align:center;color:#888;font-size:12px;padding:10px;';
    note.textContent = '검색 결과가 많아 상위 300건만 표시했어요. 검색어를 좁혀보세요.';
    wrap.appendChild(note);
  }
}

// ---- TABS ----
document.getElementById('tabMapBtn').addEventListener('click', () => {
  document.getElementById('view-map').style.display='flex';
  document.getElementById('view-list').style.display='none';
  setTimeout(()=>map.invalidateSize(), 50);
});
document.getElementById('tabListBtn').addEventListener('click', () => {
  document.getElementById('view-map').style.display='none';
  document.getElementById('view-list').style.display='block';
});

document.getElementById('sidebarToggle').addEventListener('click', () => {
  const aside = document.querySelector('#view-map aside');
  const toggle = document.getElementById('sidebarToggle');
  const header = document.querySelector('header');
  aside.classList.toggle('collapsed');
  const isCollapsed = aside.classList.contains('collapsed');
  toggle.textContent = isCollapsed ? '▶' : '◀';
  setTimeout(() => { if(map) map.invalidateSize(); }, 260);
});

document.getElementById('sheetHandle').addEventListener('click', () => {
  const aside = document.querySelector('#view-map aside');
  aside.classList.toggle('sheet-expanded');
  setTimeout(() => { if(map) map.invalidateSize(); }, 260);
});

// ---- INIT ----
try{
  populateFilters();
  initMap();
  initIntangibleList();
}catch(err){
  showMsg('페이지를 불러오는 중 오류가 발생했습니다: ' + err.message);
